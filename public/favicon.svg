<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Vibrant Play Store / App Store Inspired Gradients -->
    <linearGradient id="p-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <linearGradient id="p-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="100%" stop-color="#E00034" />
    </linearGradient>
    <linearGradient id="s-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF00" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>
    <linearGradient id="s-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>
    <linearGradient id="bg-plate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E222B" />
      <stop offset="100%" stop-color="#0F1117" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Modern Rounded App Icon Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-plate)" />
  <rect width="504" height="504" x="4" y="4" rx="124" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="8" fill="none" />

  <!-- Geometric Interlocking "P" & "S" Structure -->
  <g filter="url(#glow)">
    <!-- Letter 'P' Main Left Stem (Faceted Blue Prism) -->
    <path d="M120 120 C120 102.3 134.3 88 152 88 L216 88 L216 384 C216 401.7 201.7 416 184 416 L152 416 C134.3 416 120 401.7 120 384 Z" fill="url(#p-blue)" />

    <!-- Letter 'P' Top Geometric Loop & Play Store Corner (Coral Red Facet) -->
    <path d="M216 88 L320 88 C375.2 88 416 124.8 416 176 C416 227.2 375.2 264 320 264 L216 264 Z" fill="url(#p-red)" />
    
    <!-- Letter 'P' Inner Geometric Cutout -->
    <path d="M216 144 L308 144 C334.5 144 354 158.3 354 176 C354 193.7 334.5 208 308 208 L216 208 Z" fill="#0F1117" />

    <!-- Geometric Intersecting Facet Transition between P & S -->
    <polygon points="216,208 308,208 250,264 216,264" fill="#C5002C" opacity="0.6" />

    <!-- Letter 'S' Dynamic Diagonal Stroke (Amber Gold Facet) -->
    <path d="M380 236 C380 236 348 248 304 258 L240 274 C190 286 160 316 160 354 C160 398 198 424 254 424 L360 424 C377.7 424 392 409.7 392 392 L392 368 C392 350.3 377.7 336 360 336 L262 336 C242 336 226 326 226 312 C226 298 240 288 266 282 L334 266 C376 256 400 232 400 196 C400 190 396 178 392 172 C392 172 380 236 380 236 Z" fill="url(#s-yellow)" />

    <!-- Letter 'S' Lower Base Anchor Facet (Emerald / Cyan Gradient) -->
    <path d="M192 360 C192 330 216 310 252 300 L320 284 C358 274 380 256 386 236 C390 248 392 260 392 272 C392 316 358 344 310 354 L240 370 C220 374 210 384 210 394 C210 406 224 416 248 416 L360 416 C377.7 416 392 401.7 392 384 L392 392 C392 409.7 377.7 424 360 424 L254 424 C198 424 160 398 160 354 L192 360 Z" fill="url(#s-green)" />
  </g>
</svg>
